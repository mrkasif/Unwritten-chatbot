services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gemini-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHAT_DB_PATH=/app/data/chat.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gemini-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_BASE=http://backend:8000
      - BACKEND_URL=http://backend:8000/api/chat/stream
    depends_on:
      - backend
    restart: unless-stopped